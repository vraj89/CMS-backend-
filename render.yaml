services:
  - type: web
    name: vraj-prelytix-cms-api
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RESEED
        value: "true"
      - key: FRONTEND_URL
        sync: false
